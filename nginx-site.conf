# 示例：请修改网站根目录和域名，不要覆盖其他站点的现有配置。
server {
    listen 80;
    server_name your-domain.example;
    root /www/wwwroot/genie-portfolio;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    sendfile on;
    location / { try_files $uri $uri/ =404; }
    location ^~ /api/ { return 404; }
    location ~* /editor[^/]*\.(html|js|css)$ { return 404; }
    location ~ /\. { deny all; }
}
